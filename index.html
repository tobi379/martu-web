<!doctype html>
<!-- Página pública de un viaje de Martu: ?t=TOKEN. Estática (GitHub Pages: repo tobi379/martu-web, copiar este archivo y
     hacer push). Lee el viaje con la RPC `shared_trip` de Supabase (publishable key, solo lectura) y las fotos por la
     función `trip`. Español o inglés según el navegador; fechas y números con Intl. -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vayra</title>
<meta property="og:title" content="Vayra"><meta property="og:description" content="Un viaje compartido desde Vayra">
<meta property="og:image" content="https://tobi379.github.io/martu-web/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#EE4A2F">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--coral:#EE4A2F;--text:#1F1A24;--muted:#6E6573;--line:#E9E3DF;--soft:#F7F2EE}
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--text);background:#fff}
  header{padding:20px 16px 12px}h1{margin:0 0 4px;font-size:28px}header p{margin:0;color:var(--muted)}header .stats{color:var(--text);font-weight:600;margin-top:4px}
  #map{height:52vh;min-height:320px}
  .cta{display:block;margin:16px;padding:16px;border-radius:14px;background:var(--coral);color:#fff;text-align:center;font-weight:600;text-decoration:none}
  .hint{margin:0 16px 8px;font-size:13px;color:var(--muted);text-align:center}
  .stop{padding:12px 16px;border-top:1px solid var(--line)}.stop h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:17px}
  .stop h2 small{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
  .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font-size:13px;font-weight:700;align-items:center;justify-content:center;flex:none}
  .place{display:flex;gap:12px;align-items:center;padding:6px 0;color:inherit;text-decoration:none}.place img,.ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
  .place span{display:flex;flex-direction:column;min-width:0}.place .credit{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place b{font-weight:600}.place small{color:var(--muted)}
  .marker{display:flex;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font-weight:700;font-size:13px;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  footer{padding:28px 16px 36px;display:flex;justify-content:center;color:var(--coral)}footer svg{height:26px;width:auto;fill:currentColor}
  .empty{padding:48px 16px;text-align:center;color:var(--muted)}
  @media(prefers-color-scheme:dark){:root{--text:#F3EFF4;--muted:#B9B0BD;--line:#342D39;--soft:#211C25}body{background:#17131A}}   /* tinta y grises cálidos de la marca */
</style></head><body>
<div id="app"><p class="empty" id="loading">…</p></div>
<script>
const SUPABASE = "https://zdnnhskdtcinfmozkiyi.supabase.co";
const KEY = "sb_publishable_FzK6lQWgadVVHTlxLKNMIQ_H7AwESdq";   // pública por diseño: RLS y la RPC protegen los datos
const strings = {
  es: { places: "lugares", countries: "países", days: "días", nights: (n) => n === 1 ? "1 noche" : `${n} noches`,
        photo: "Foto", open: "Usar como plantilla en Vayra", hint: "Se abre en Vayra para iPhone: el viaje entra como uno nuevo, con sus paradas y lugares.",
        notFound: "Este viaje ya no se comparte.", eat: "Comer", sleep: "Dormir", do: "Hacer", see: "Ver", tip: "Tip" },
  en: { places: "places", countries: "countries", days: "days", nights: (n) => n === 1 ? "1 night" : `${n} nights`,
        photo: "Photo", open: "Use as a template in Vayra", hint: "Opens in Vayra for iPhone: the trip comes in as a new one, with its stops and places.",
        notFound: "This trip is no longer shared.", eat: "Eat", sleep: "Sleep", do: "Do", see: "See", tip: "Tip" },
};
const lang = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
const t = strings[lang];
document.documentElement.lang = lang;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Las fechas del viaje son días de calendario (medianoche UTC): se muestran en UTC o alguien al oeste ve un día antes.
const day = (ms, year = false) => new Intl.DateTimeFormat(lang, { day: "numeric", month: "short", ...(year ? { year: "numeric" } : {}), timeZone: "UTC" }).format(new Date(ms));

async function main() {
  const token = new URLSearchParams(location.search).get("t") || "";
  const r = await fetch(`${SUPABASE}/rest/v1/rpc/shared_trip`, {
    method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token }),
  }).catch(() => null);
  const trip = r?.ok ? await r.json() : null;
  if (!trip) { document.getElementById("loading").textContent = t.notFound; return; }

  document.title = `${trip.name} · Vayra`;
  const countries = new Set([...trip.stops, ...trip.places].map((x) => x.countryCode).filter(Boolean)).size;
  const days = Math.round((Date.parse(trip.endDate) - Date.parse(trip.startDate)) / 86_400_000) + 1;
  const stats = `${trip.places.length} ${t.places} · ${countries} ${t.countries} · ${days} ${t.days}`;
  // Llegada a cada parada, igual que Trip.arrival en la app: la salida más las noches anteriores; un vuelo fijo reancla.
  let cursor = Date.parse(trip.startDate);
  const arrivals = trip.stops.map((s) => { if (s.arrivalOverride) cursor = Date.parse(s.arrivalOverride); const a = cursor; cursor += s.nights * 86_400_000; return a; });
  const stopsHTML = trip.stops.map((s, i) => {
    const places = trip.places.filter((p) => p.stopOrder === s.order);
    return `<section class="stop"><h2><span class="n">${i + 1}</span>${esc(s.city)}<small>${t.nights(s.nights)} · ${day(arrivals[i])}</small></h2>
      ${places.map((p) => `<a class="place" ${/^https?:/i.test(p.sourceURL) ? `href="${esc(p.sourceURL)}" target="_blank" rel="noopener"` : ""}>
        ${p.photo ? `<img src="${SUPABASE}/functions/v1/trip/${encodeURIComponent(token)}/photo/${p.id}" alt="" loading="lazy">` : `<span class="ph"></span>`}
        <span><b>${esc(p.name)}</b><small>${esc(t[p.category] ?? p.category)}</small>${p.photo && p.photoCredit ? `<small class="credit">${t.photo}: ${esc(p.photoCredit)}</small>` : ""}</span></a>`).join("")}
    </section>`;
  }).join("");
  document.getElementById("app").innerHTML = `
<header><h1>${esc(trip.name)}</h1><p>${day(Date.parse(trip.startDate))} – ${day(Date.parse(trip.endDate), true)}</p><p class="stats">${esc(stats)}</p></header>
<div id="map"></div>
<a class="cta" href="martu://trip/${encodeURIComponent(token)}">${t.open}</a><p class="hint">${t.hint}</p>
${stopsHTML}

  const map = L.map("map", { scrollWheelZoom: false });
  // ponytail: tiles OSM con nombres locales (Bangkok en tailandés); CARTO Voyager si molesta.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
  for (let i = 1; i < trip.stops.length; i++)
    L.polyline([[trip.stops[i - 1].latitude, trip.stops[i - 1].longitude], [trip.stops[i].latitude, trip.stops[i].longitude]],
